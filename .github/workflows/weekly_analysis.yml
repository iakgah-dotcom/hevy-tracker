name: BIG3 Weekly Analysis

on:
  schedule:
    # 毎週月曜 07:00 JST (日曜 22:00 UTC)
    - cron: "0 22 * * 0"
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write   # Excel ファイルをリポジトリにコミットするため

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BIG3 analysis
        env:
          HEVY_API_KEY:    ${{ secrets.HEVY_API_KEY }}
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
        run: python main.py

      - name: Commit updated Excel report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/BIG3_tracker.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update BIG3 weekly report $(date -u +'%Y-%m-%d')"
            git push
          fi
